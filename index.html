<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ライトアップ SaaS商材の資料置き場">
<meta name="theme-color" content="#B23A26">
<title>SaaS 資料置き場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
  :root{--paper:#FFFFFF;--ink:#131110;--grey:#6B6460;--faint:#6F6864;--rule:#E6E1DD;--accent:#B23A26}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#121110;--ink:#F2EEEB;--grey:#A9A19D;--faint:#837B77;--rule:#2B2724;--accent:#E8705A}
  }
  :root[data-theme="dark"]{--paper:#121110;--ink:#F2EEEB;--grey:#A9A19D;--faint:#837B77;--rule:#2B2724;--accent:#E8705A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.95}
  .wrap{max-width:900px;margin:0 auto;padding:0 28px}
  .eyebrow{font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.26em;color:var(--accent);margin:0}
  h1{font-size:clamp(30px,6vw,60px);font-weight:900;line-height:1.18;letter-spacing:-.03em;
    margin:26px 0 0;line-break:strict;word-break:keep-all}
  .lead{font-size:17px;color:var(--grey);margin:26px 0 0;max-width:620px}
  header{padding:clamp(56px,9vw,110px) 0 clamp(40px,6vw,68px);border-bottom:1px solid var(--rule)}
  .rows{border-top:1px solid var(--rule);margin:0}
  a.row{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;
    padding:30px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
  a.row:hover h2{color:var(--accent)}
  a.row h2{font-size:clamp(19px,2.5vw,26px);font-weight:900;margin:0;line-height:1.5}
  a.row p{margin:8px 0 0;font-size:15px;color:var(--grey)}
  a.row .go{font-family:Inter,sans-serif;font-weight:900;color:var(--accent);font-size:18px}
  .tagline{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;
    color:var(--accent);border:1.5px solid var(--accent);padding:2px 9px;margin-bottom:10px}
  main{padding:clamp(40px,6vw,72px) 0 clamp(56px,8vw,100px)}
  footer{border-top:1px solid var(--rule);padding:30px 0 60px}
  footer p{font-size:13px;color:var(--faint);margin:0;line-height:1.85}
  footer p+p{margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="eyebrow">WRITEUP / SAAS</p>
    <h1>SaaS 資料置き場</h1>
    <p class="lead">ライトアップのSaaS商材について、営業・企画で使う資料をまとめています。商材ごとにフォルダを分けています。</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="rows">
      <a class="row" href="./lsync-sales-talk/">
        <div>
          <span class="tagline">社内用</span>
          <h2>Lシンク 営業トーク集</h2>
          <p>話す順番、商談で口に出す言葉、業種別の言い換え、必ず聞かれる9つの質問への返し方、言ってはいけないこと。</p>
        </div>
        <span class="go">→</span>
      </a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>社内資料です。料金・仕様・個人情報の取り扱いは各資料に記載していません。社内の質問部屋で最新を確認してください。</p>
    <p>© Writeup Co., Ltd.</p>
  </div>
</footer>

</body>
</html>
