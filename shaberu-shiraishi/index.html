<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しゃべる白石さん</title>
<style>
:root{
  --bg:#f4f4f2; --panel:#ffffff; --ink:#1d1d22; --sub:#5d5f6a; --line:#dcdcd8;
  --accent:#3b4470; --accent-ink:#ffffff; --soft:#ecedf3; --stage:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171b; --panel:#1f2026; --ink:#ececf0; --sub:#a4a6b2; --line:#33353d;
    --accent:#8e9be0; --accent-ink:#15161a; --soft:#2a2c35; --stage:#24252c;
  }
}
:root[data-theme="dark"]{
  --bg:#16171b; --panel:#1f2026; --ink:#ececf0; --sub:#a4a6b2; --line:#33353d;
  --accent:#8e9be0; --accent-ink:#15161a; --soft:#2a2c35; --stage:#24252c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.7;word-break:normal;overflow-wrap:anywhere;line-break:strict}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
header h1{font-size:clamp(22px,3vw,28px);margin:0 0 4px;letter-spacing:.02em;word-break:keep-all}
header p{margin:0 0 20px;color:var(--sub);font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.stage-col{position:sticky;top:16px}
@media (max-width:860px){.stage-col{position:static}}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  aspect-ratio:1/1;width:100%;max-width:560px;margin:0 auto;background:var(--stage)}
.stage.bg-white{background:#fff}
.stage.bg-green{background:#00b140}
.stage.bg-check{background-color:#fff;
  background-image:linear-gradient(45deg,#e6e6e6 25%,transparent 25%,transparent 75%,#e6e6e6 75%),
  linear-gradient(45deg,#e6e6e6 25%,transparent 25%,transparent 75%,#e6e6e6 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
#gl,#c2d{width:100%;height:100%;display:block;cursor:pointer}
.sub{max-width:560px;margin:12px auto 0;min-height:3.4em;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:10px 16px;font-size:17px;line-height:1.6;color:var(--ink)}
.sub .done{color:var(--ink)} .sub .rest{color:var(--sub);opacity:.35}
.sub.empty{color:var(--sub);font-size:15px}
.rec-dot{position:absolute;top:12px;left:12px;display:none;align-items:center;gap:6px;
  background:rgba(0,0,0,.6);color:#fff;font-size:14px;padding:4px 10px;border-radius:99px}
.rec-dot::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff4d4d}
.recording .rec-dot{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-size:15px;margin:18px 0 8px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.panel h2:first-child{margin-top:0}
textarea{width:100%;min-height:120px;resize:vertical;font:inherit;font-size:17px;line-height:1.6;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:15px;
  min-height:44px;padding:8px 16px;border-radius:12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 26px}
.btn.primary:hover{filter:brightness(1.08)}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;
  min-height:40px;padding:6px 14px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sample{font-size:14px;text-align:left}
.hint{font-size:14px;color:var(--sub);margin:8px 0 0}
label.inline{display:flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
select,input[type=range]{font:inherit;font-size:15px}
select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:4px 8px;max-width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.kv span{font-size:14px;color:var(--sub)}
.now{font-size:14px;color:var(--sub);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>しゃべる白石さん</h1>
    <p>文章を入れて「話す」を押すと、口・目・眉・腕が文章に合わせて動きます。</p>
  </header>
  <div class="grid">
    <div class="stage-col">
      <div class="stage bg-check" id="stage">
        <canvas id="gl" width="1000" height="1000" aria-label="白石さんのイラスト"></canvas>
        <div class="rec-dot">録画中</div>
      </div>
      <div class="sub empty" id="sub">ここに話している文章が出ます</div>
      <div class="now" id="now">表情：笑顔</div>
    </div>

    <div class="panel">
      <h2>しゃべらせる文章</h2>
      <textarea id="txt">こんにちは、白石です。今日はAIで営業がどう変わるのか、一緒に考えていきましょう！</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="say">話す</button>
        <button class="btn" id="stop">止める</button>
        <button class="btn" id="rec">話して録画</button>
      </div>
      <p class="hint">⌘（Ctrl）＋Enterでも話します。録画は動画（WebM）として保存され、音声は入りません。</p>

      <h2>例文</h2>
      <div class="row" id="samples"></div>

      <h2>表情</h2>
      <div class="row" id="exprs"></div>
      <p class="hint">「自動」は文の中身から表情を選びます（「ありがとう」で笑顔、「？」で首をかしげる、など）。</p>

      <h2>声</h2>
      <div class="kv">
        <span>読み上げ</span>
        <label class="inline"><input type="checkbox" id="tts" checked> 声を出す</label>
        <span>声の種類</span>
        <select id="voice"></select>
        <span>速さ</span>
        <input type="range" id="rate" min="0.7" max="1.5" step="0.05" value="1.05">
        <span>高さ</span>
        <input type="range" id="pitch" min="0.6" max="1.4" step="0.05" value="0.9">
      </div>

      <h2>背景</h2>
      <div class="row" id="bgs"></div>
    </div>
  </div>
</div>

  if(/(重要|大事|大切|注意|必ず|絶対|お願いします|ポイント|結論|ぜひ|是非)/.test(s)) return 'serious';

const VOWELS = 'aiueo';
function buildTimeline(text){
  const ev=[]; let t=0; let si=0; const sents=[]; let cur='', curStart=0;
  const push=(kind,v,dur,ci)=>{ ev.push({t,dur,kind,v,ci,si}); t+=dur; };
  const chars=[...text];
  chars.forEach((ch,ci)=>{
    cur+=ch;
    if(KANA_V[ch]){
      if(SMALL.has(ch) && ev.length && ev[ev.length-1].kind==='v'){ ev[ev.length-1].v=KANA_V[ch]; return; }
      push('v',KANA_V[ch],125,ci);
    } else if(ch==='ん'||ch==='ン'){ push('v','n',110,ci); }
    else if(ch==='っ'||ch==='ッ'){ push('v','q',95,ci); }
    else if(ch==='ー'||ch==='〜'||ch==='～'){ if(ev.length){ev[ev.length-1].dur+=110; t+=110;} }
    else if(/[一-鿿々]/.test(ch)){
      const c=ch.charCodeAt(0); push('v',VOWELS[c%5],125,ci); push('v',VOWELS[(c>>3)%5],125,ci);
    } else if(/[A-Za-zＡ-Ｚａ-ｚ]/.test(ch)){
      const c=ch.charCodeAt(0); push('v',VOWELS[c%5],110,ci); if(/[A-ZＡ-Ｚ]/.test(ch)) push('v',VOWELS[(c>>2)%5],110,ci);
    } else if(/[0-9０-９]/.test(ch)){
      const c=ch.charCodeAt(0); push('v',VOWELS[c%5],115,ci); push('v',VOWELS[(c+2)%5],115,ci);
    } else if(/[、，,]/.test(ch)){ push('p','',230,ci); }
    else if(/[。．.!！?？]/.test(ch)){
      const last=ev[ev.length-1];
      if(last && last.kind==='p' && last.end){ last.dur+=60; t+=60; }
      else { push('p','',430,ci); ev[ev.length-1].end=true; }
      if(!/[!！?？]/.test(chars[ci+1]||'')){ sents.push({text:cur,start:curStart,end:ci}); cur=''; curStart=ci+1; si++; }
    }
    else if(ch==='…'){ push('p','',480,ci); }
    else if(ch==='\n'){ push('p','',300,ci); if(cur.trim()){ sents.push({text:cur,start:curStart,end:ci}); si++; } cur=''; curStart=ci+1; }
    else if(/\s/.test(ch)){ push('p','',90,ci); }
  });
  if(cur.trim()) sents.push({text:cur,start:curStart,end:chars.length-1});
  sents.forEach(s=>s.expr=exprOf(s.text.trim()));
  return {ev,total:t,sents,chars};
}

/* ---------- 状態 ---------- */
const P = {open:0,wide:1,smile:1,grin:1,happy:0,blink:0,browY:1.2,browTilt:0,tilt:0,hx:0,hy:0,jaw:0,arm:0,tap:0,tap2:0,breath:0,sway:0,hair:0};
let manualExpr='auto', idleExpr='joy', curExpr='joy';
let speaking=false, tl=null, playhead=0, lastCi=-1, curSent=-1, timelineDone=false, ttsActive=false;
const pulse={nod:0,arm:0,brow:0,tap:0,tap2:0};
let drift={hx:0,hy:0,next:0}, nextBlink=1.5, blinkT=-1, tapNext=0;

/* ---------- 合成用の2Dキャンバス ---------- */
const comp=document.createElement('canvas'); comp.width=comp.height=SIZE;
const cx=comp.getContext('2d');

function lerp(a,b,t){return a+(b-a)*t}
function quadMidCtrl(y0,y1,mid){ return 2*mid-(y0+y1)/2; }

const EYE = {
  L:{x0:250,x1:293,yl:196,yr:196,mx:271,top:186,closed:198},
  R:{x0:343,x1:387,yl:194,yr:197,mx:363,top:187,closed:198},
};
function drawEye(k){
  const e=EYE[k], patch=IMG['eye'+k];
  if(P.happy>0.5){
    cx.drawImage(patch.im,patch.x,patch.y);
    cx.beginPath(); cx.moveTo(e.x0+2,e.yl+1);
    cx.quadraticCurveTo(e.mx, quadMidCtrl(e.yl+1,e.yr+1,189), e.x1-2, e.yr+1);
    cx.lineWidth=3; cx.strokeStyle='#1b1416'; cx.lineCap='round'; cx.stroke();
    return;
  }
  const b=P.blink; if(b<0.03) return;
  const mid=lerp(e.top-1,e.closed,b), c=quadMidCtrl(e.yl,e.yr,mid);
  cx.save(); cx.beginPath();
  cx.moveTo(e.x0-2,181); cx.lineTo(e.x1+2,181); cx.lineTo(e.x1+2,e.yr);
  cx.quadraticCurveTo(e.mx,c,e.x0-2,e.yl); cx.closePath(); cx.clip();
  cx.drawImage(patch.im,patch.x,patch.y); cx.restore();
  if(b>0.2){
    cx.beginPath(); cx.moveTo(e.x0+1,e.yl); cx.quadraticCurveTo(e.mx,c,e.x1-1,e.yr);
    cx.lineWidth=2.8; cx.strokeStyle='#1b1416'; cx.lineCap='round'; cx.stroke();
  }
}
function drawBrow(k){
  const s=IMG['brow'+k]; const pv = k==='L'?[274,166]:[356,167];
  const ang = (k==='L'?-1:1)*P.browTilt*0.13;
  cx.save(); cx.beginPath(); cx.rect(0,0,SIZE,173.5); cx.clip();
  cx.translate(pv[0],pv[1]-P.browY); cx.rotate(ang); cx.translate(-pv[0],-pv[1]);
  cx.drawImage(s.im,s.x,s.y); cx.restore();
}
function drawMouth(alpha){
  if(alpha<=0.01) return;
  const o=Math.max(0,P.open), w=P.wide, sm=P.smile;
  const mx=313, hw=43*w, lift=sm*4;
  const L=[mx-hw, 273.5-lift+ (1-w)*3], R=[mx+hw, 275-lift+(1-w)*3];
  const topMid=277+(1-w)*2, cTop=quadMidCtrl(L[1],R[1],topMid);
  const H=0.5+o*24, botMid=topMid+H, cBot=quadMidCtrl(L[1],R[1],botMid);
  cx.save(); cx.globalAlpha=alpha;
  if(H>2.2){
    const shape=()=>{cx.beginPath(); cx.moveTo(L[0],L[1]); cx.quadraticCurveTo(mx,cTop,R[0],R[1]); cx.quadraticCurveTo(mx,cBot+ (w<0.8?H*0.25:0),L[0],L[1]); cx.closePath();};
    shape(); cx.fillStyle='#5a1d22'; cx.fill();
    cx.save(); shape(); cx.clip();
    const th=Math.min(7,H*0.38);
    cx.beginPath(); cx.moveTo(L[0]-2,L[1]-2); cx.quadraticCurveTo(mx,cTop-2,R[0]+2,R[1]-2);
    cx.lineTo(R[0]+2,R[1]+th); cx.quadraticCurveTo(mx,cTop+th,L[0]-2,L[1]+th); cx.closePath();
    cx.fillStyle='#fbfbf8'; cx.fill();
    cx.beginPath(); cx.ellipse(mx,botMid+1,hw*0.5,Math.min(H*0.32,6.5),0,0,Math.PI*2); cx.fillStyle='#d26a74'; cx.fill();
    cx.restore();
    shape(); cx.lineWidth=1.5; cx.strokeStyle='#3c2326'; cx.stroke();
  }
  cx.beginPath(); cx.moveTo(L[0],L[1]); cx.quadraticCurveTo(mx,cTop,R[0],R[1]);
  cx.lineWidth=3.2; cx.strokeStyle='#1b1416'; cx.lineCap='round'; cx.stroke();
  cx.fillStyle='#1b1416';
  cx.beginPath(); cx.arc(L[0]+1,L[1],1.9,0,Math.PI*2); cx.arc(R[0]-1,R[1],1.9,0,Math.PI*2); cx.fill();
  cx.restore();
}
function composite(){
  cx.clearRect(0,0,SIZE,SIZE);
  cx.drawImage(IMG.base.im,0,0);
  drawBrow('L'); drawBrow('R');
  drawEye('L'); drawEye('R');
  if(P.grin>0.01){ cx.save(); cx.globalAlpha=P.grin; cx.drawImage(IMG.grin.im,IMG.grin.x,IMG.grin.y); cx.restore(); }
  drawMouth(1-P.grin);
}

/* ---------- WebGL：画像全体をなめらかに歪ませる（首・顔の向き・呼吸・腕） ---------- */
const canvas=document.getElementById('gl');
let gl=null, prog, U={}, tex;
const VS=`attribute vec2 a;varying vec2 v;void main(){v=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}`;
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;
uniform float uTilt,uHX,uHY,uJaw,uArm,uTap,uTap2,uBreath,uSway,uHair;uniform vec4 uBg;
float g2(vec2 p,vec2 c,vec2 s){vec2 d=(p-c)/s;return exp(-.5*dot(d,d));}
void main(){
  vec2 p=v*600.;
  float body=smoothstep(640.,320.,p.y);
  vec2 q=p;
  q.y+=uBreath*1.7*body;
  q.x-=uSway*1.6*body;
  float wy=smoothstep(352.,298.,p.y);
  float wx=mix(smoothstep(175.,115.,abs(p.x-305.)),1.,smoothstep(332.,292.,p.y));
  float wh=wy*wx;
  vec2 pv=vec2(305.,338.);
  float a=-uTilt*wh;
  vec2 d=q-pv; q=pv+vec2(cos(a)*d.x-sin(a)*d.y,sin(a)*d.x+cos(a)*d.y);
  float gf=g2(p,vec2(312.,230.),vec2(78.,78.))*wh;
  q.x-=(uHX*2.5*wh+uHX*6.*gf);
  q.y-=(uHY*1.5*wh+uHY*4.*gf);
  q.x-=uHair*2.2*smoothstep(150.,40.,p.y);
  float gj=exp(-.5*pow((p.x-313.)/40.,2.))*smoothstep(294.,305.,p.y)*smoothstep(346.,322.,p.y);
  q.y-=uJaw*2.6*gj;
  q.y+=uArm*5.*g2(p,vec2(312.,505.),vec2(120.,42.));
  float gfi=g2(p,vec2(386.,472.),vec2(8.,10.));
  q.y-=uTap*2.4*gfi; q.x+=uTap*.9*gfi;
  q.x+=uTap2*2.*g2(p,vec2(212.,548.),vec2(11.,11.));
  vec2 uv=q/600.;
  vec4 c=texture2D(t,uv);
  if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.) c=vec4(0.);
  gl_FragColor=c+uBg*(1.-c.a);
}`;
function initGL(){
  gl=canvas.getContext('webgl',{premultipliedAlpha:true,alpha:true,preserveDrawingBuffer:true});
  if(!gl) return false;
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s;};
  prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['uTilt','uHX','uHY','uJaw','uArm','uTap','uTap2','uBreath','uSway','uHair','uBg'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return true;
}
let bgColor=[0,0,0,0];
function render(){
  composite();
  if(!gl){ const c2=canvas.getContext('2d'); c2.clearRect(0,0,canvas.width,canvas.height); c2.drawImage(comp,0,0,canvas.width,canvas.height); return; }
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,comp);
  gl.uniform1f(U.uTilt,P.tilt*Math.PI/180); gl.uniform1f(U.uHX,P.hx); gl.uniform1f(U.uHY,P.hy);
  gl.uniform1f(U.uJaw,P.jaw); gl.uniform1f(U.uArm,P.arm); gl.uniform1f(U.uTap,P.tap); gl.uniform1f(U.uTap2,P.tap2);
  gl.uniform1f(U.uBreath,P.breath); gl.uniform1f(U.uSway,P.sway); gl.uniform1f(U.uHair,P.hair);
  gl.uniform4fv(U.uBg,bgColor);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- 動き ---------- */
const subEl=document.getElementById('sub'), nowEl=document.getElementById('now');
function setNow(){ nowEl.textContent='表情：'+EXPR[curExpr].name+(manualExpr==='auto'?'（自動）':''); }
function approach(k,target,rate,dt){ P[k]+= (target-P[k])*(1-Math.exp(-dt*rate)); }
function currentEvent(){
  if(!tl) return null;
  const ev=tl.ev; for(let i=0;i<ev.length;i++){ const e=ev[i]; if(playhead>=e.t && playhead<e.t+e.dur) return e; }
  return null;
}
function showSub(si, ci){
  const s=tl.sents[si]; if(!s){return;}
  const txt=tl.chars.slice(s.start,s.end+1).join('').trim();
  const doneN=Math.max(0,Math.min(txt.length, ci - s.start + 1 - (tl.chars.slice(s.start,s.end+1).join('').length - tl.chars.slice(s.start,s.end+1).join('').trimStart().length)));
  subEl.classList.remove('empty');
  subEl.innerHTML='';
  const a=document.createElement('span'); a.className='done'; a.textContent=[...txt].slice(0,doneN).join('');
  const b=document.createElement('span'); b.className='rest'; b.textContent=[...txt].slice(doneN).join('');
  subEl.append(a,b);
}
let last=performance.now()/1000, clock=0;
function tick(nowMs){
  const now=nowMs/1000; let dt=Math.min(0.05, now-last); last=now; clock+=dt;
  const rate=+document.getElementById('rate').value;

  let target={open:0,wide:1}, ev=null;
  if(speaking && tl){
    playhead += dt*1000*(ttsActive? rate*1.0 : 1);
    ev=currentEvent();
    if(ev){
      if(ev.si!==curSent){
        curSent=ev.si; const s=tl.sents[ev.si];
        curExpr = manualExpr==='auto' ? (s?s.expr:'joy') : manualExpr; setNow();
        if(s && /[!！]/.test(s.text)) pulse.arm=1;
        if(curExpr==='serious'||curExpr==='joy') pulse.arm=Math.max(pulse.arm,0.7);
        if(curExpr==='surprise') pulse.brow=1;
      }
      if(ev.ci!==lastCi){
        lastCi=ev.ci; showSub(ev.si,ev.ci);
        if(ev.kind==='v' && Math.random()<0.18) pulse.nod=0.35+Math.random()*0.3;
      }
      if(ev.kind==='v'){ const sh=VSHAPE[ev.v]; const ph=(playhead-ev.t)/ev.dur;
        const env = ph<0.75?1:Math.max(0.35,1-(ph-0.75)*2.6);
        target={open:sh[0]*env,wide:sh[1]}; }
      else if(ev.end && playhead-ev.t<40){ pulse.nod=Math.max(pulse.nod,0.9); }
    } else if(playhead>=tl.total){
      timelineDone=true;
      if(ttsActive && speechSynthesis.speaking){ // 音声がまだ続いていれば口だけ動かし続ける
        const v=VOWELS[Math.floor(clock*8)%5]; const sh=VSHAPE[v]; target={open:sh[0]*(0.6+0.4*Math.sin(clock*30)),wide:sh[1]};
      } else finishSpeak();
    }
    if(clock>tapNext){ pulse.tap=1; tapNext=clock+0.45+Math.random()*0.9; if(Math.random()<0.35) pulse.tap2=1; }
  } else {
    if(clock>tapNext){ if(Math.random()<0.3) pulse.tap=1; tapNext=clock+2.5+Math.random()*4; }
  }

  const E=EXPR[speaking?curExpr:(manualExpr==='auto'?idleExpr:manualExpr)];
  // まばたき
  if(blinkT<0 && clock>nextBlink){ blinkT=0; nextBlink=clock+1.8+Math.random()*3.8; if(Math.random()<0.18) nextBlink=clock+0.32; }
  if(blinkT>=0){ blinkT+=dt; const tt=blinkT;
    P.blink = tt<0.07? tt/0.07 : tt<0.11? 1 : tt<0.23? 1-(tt-0.11)/0.12 : 0;
    if(tt>=0.23){blinkT=-1;P.blink=0;} }
  // 視線・顔の向きのゆらぎ
  if(clock>drift.next){ drift.hx=(Math.random()-0.5)*(speaking?1.1:0.6); drift.hy=(Math.random()-0.5)*(speaking?0.5:0.3); drift.next=clock+(speaking?0.9:2.2)+Math.random()*1.6; }
  // パルスの減衰
  for(const k in pulse) pulse[k]*=Math.exp(-dt*(k==='tap'||k==='tap2'?9:k==='nod'?5:2.2));

  const mOpen = speaking? target.open : E.open, mWide = speaking? target.wide : E.wide;
  approach('open',mOpen,speaking?28:10,dt);
  approach('wide',mWide,speaking?20:8,dt);
  approach('grin',speaking?0:E.grin,speaking?14:5,dt);
  approach('happy',speaking?0:E.happy,10,dt);
  approach('smile',E.smile,6,dt);
  approach('browY',E.browY+pulse.brow*2.2+(speaking?Math.max(0,target.open-0.7)*1.2:0),9,dt);
  approach('browTilt',E.browTilt,6,dt);
  approach('tilt',E.tilt+Math.sin(clock*0.55)*0.9,3.5,dt);
  approach('hx',E.hx+drift.hx,2.6,dt);
  approach('hy',E.hy+drift.hy+pulse.nod*0.9,6,dt);
  approach('jaw',P.open,30,dt);
  approach('arm',pulse.arm*0.9+(speaking?0.12+0.12*Math.sin(clock*2.1):0),7,dt);
  P.tap=Math.sin(Math.min(1,(1-pulse.tap))*Math.PI)*pulse.tap*1.6;
  P.tap2=Math.sin(Math.min(1,(1-pulse.tap2))*Math.PI)*pulse.tap2*1.6;
  P.breath=Math.sin(clock*2*Math.PI/3.8)*0.5+0.5;
  P.sway=Math.sin(clock*0.8)*0.6;
  P.hair=Math.sin(clock*1.3)*0.4+P.hx*0.6;

  if(!speaking && manualExpr==='auto' && curExpr!==idleExpr){ curExpr=idleExpr; setNow(); }
  if(!speaking && manualExpr!=='auto' && curExpr!==manualExpr){ curExpr=manualExpr; setNow(); }
  render();
  requestAnimationFrame(tick);
}

/* ---------- 話す ---------- */
const ttsEl=document.getElementById('tts'), voiceEl=document.getElementById('voice');
let voices=[];
function loadVoices(){
  if(!('speechSynthesis' in window)) { ttsEl.checked=false; ttsEl.disabled=true; voiceEl.innerHTML='<option>この環境では使えません</option>'; return; }
  voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  const male=/(Otoya|Hattori|Ichiro|Keita|Daisuke|Takumi|男性|Male)/i;
  voices.sort((a,b)=> (male.test(b.name)-male.test(a.name)));
  voiceEl.innerHTML='';
  if(!voices.length){ voiceEl.innerHTML='<option value="">日本語の声が見つかりません</option>'; return; }
  voices.forEach((v,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=v.name+(male.test(v.name)?'（男性）':''); voiceEl.append(o); });
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; } else loadVoices();

let onFinish=null;
function speak(text){
  text=(text||'').trim(); if(!text) return;
  stopSpeak(true);
  tl=buildTimeline(text); playhead=0; lastCi=-1; curSent=-1; timelineDone=false;
  const go=()=>{ speaking=true; clock=clock; tapNext=0; };
  if(ttsEl.checked && 'speechSynthesis' in window && voices.length){
    const u=new SpeechSynthesisUtterance(text);
    const v=voices[+voiceEl.value||0]; if(v){u.voice=v;u.lang=v.lang;} else u.lang='ja-JP';
    u.rate=+document.getElementById('rate').value; u.pitch=+document.getElementById('pitch').value;
    ttsActive=true;
    let started=false;
    u.onstart=()=>{ started=true; playhead=0; go(); };
    u.onboundary=(e)=>{ if(!tl) return; const ci=[...text.slice(0,e.charIndex)].length;
      const ev=tl.ev.find(x=>x.ci>=ci); if(ev && Math.abs(ev.t-playhead)>160) playhead=ev.t; };
    u.onend=()=>{ if(speaking) finishSpeak(); };
    u.onerror=()=>{ if(!started){ ttsActive=false; go(); } };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started && !speaking){ ttsActive=false; go(); } },1200);
  } else { ttsActive=false; go(); }
}
function finishSpeak(){
  speaking=false; tl=null; pulse.nod=0.6;
  if(manualExpr==='auto'){ idleExpr='joy'; }
  setTimeout(()=>{ if(!speaking){ subEl.classList.add('empty'); subEl.textContent='ここに話している文章が出ます'; } },1600);
  if(onFinish){ const f=onFinish; onFinish=null; setTimeout(f,600); }
}
function stopSpeak(silent){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(speaking){ speaking=false; tl=null; }
  if(!silent && onFinish){ const f=onFinish; onFinish=null; f(); }
}

const ew=document.getElementById('exprs');
[['auto','自動'],...Object.entries(EXPR).map(([k,v])=>[k,v.name])].forEach(([k,n])=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=n; b.dataset.k=k;
  b.setAttribute('aria-pressed',k===manualExpr); b.onclick=()=>{ manualExpr=k;
    ew.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===k));
    if(k!=='auto'){ curExpr=k; pulse.nod=0.5; } setNow(); };
  ew.append(b);
});

const stage=document.getElementById('stage');
const BGS=[['check','透明',[0,0,0,0]],['white','白',[1,1,1,1]],['green','グリーンバック',[0,177/255,64/255,1]]];
const bw=document.getElementById('bgs'); let bgMode='check';
function setBg(k){ bgMode=k; const b=BGS.find(x=>x[0]===k); stage.className='stage bg-'+k; bgColor=b[2];
  bw.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===k)); }
BGS.forEach(([k,n])=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=n; b.dataset.k=k; b.onclick=()=>setBg(k); bw.append(b); });

/* ---------- 録画 ---------- */
document.getElementById('rec').onclick=()=>{
  if(!canvas.captureStream || !window.MediaRecorder){ alert('このブラウザでは録画できません（Chromeでお試しください）'); return; }
  const prevBg=bgMode; if(bgMode==='check') setBg('white');
  const stream=canvas.captureStream(30);
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6e6}:undefined); const chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{ stage.classList.remove('recording'); setBg(prevBg);
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='shiraishi-talk.webm'; a.click(); };
  stage.classList.add('recording'); rec.start();
  setTimeout(()=>{ onFinish=()=>rec.state!=='inactive'&&rec.stop(); speak(txt.value); },400);
};

loadAll().then(()=>{
  try{ if(!initGL()) gl=null; }catch(e){ console.error(e); gl=null; }
  setBg('check'); setNow();
  requestAnimationFrame(tick);
});
