<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お申し込みフォームへ移動します｜制度100件の資料</title>
<!-- 遷移先を変えるときは、この2か所（metaのcontentと、下のFORM_URL）だけ直す -->
<meta http-equiv="refresh" content="2;url=https://www.writeup.jp/contact/">
<style>
/* ===== lp-base.css（改行制御・最小文字サイズ） ===== */
h1, h2, h3, h4, h5,
.lead, .catch, .hero__title, [data-keep-phrase] {
  word-break: auto-phrase;
  line-break: strict;
  overflow-wrap: anywhere;
}
@supports not (word-break: auto-phrase) {
  h1, h2, h3, h4, h5,
  .lead, .catch, .hero__title, [data-keep-phrase] { word-break: normal; }
}
.nobr { white-space: nowrap; }
:root { --fs-min: 12px; --fs-body: 16px; }
small, .note, figcaption { font-size: var(--fs-min); line-height: 1.7; }
h1, .hero__title { font-size: clamp(1.55rem, 5.2vw, 3.25rem); line-height: 1.35; }
:root { --fixed-cta-h: 0px; }
img, svg, video, canvas, iframe { max-width: 100%; height: auto; }
pre, table, .scroll-x { overflow-x: auto; max-width: 100%; }

:root{
  --paper:#fff; --ink:#1a1a1a; --gray:#707070; --navy:#1f3a63; --rule:#e6e6e6;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --min:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;
  font-feature-settings:"palt" 1;padding:32px 20px}
.box{max-width:560px;text-align:center}
h1{margin:0 0 18px;font-family:var(--min);font-weight:700;font-size:clamp(1.3rem,4.2vw,1.9rem);line-height:1.5}
p{margin:0 0 14px;font-size:15px;color:var(--gray)}
.bar{width:180px;height:3px;margin:0 auto 26px;background:var(--rule);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--navy);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
a.go{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 30px;margin-top:8px;
  background:var(--navy);color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.back{display:block;margin-top:22px;font-size:13px;color:var(--gray)}
@media (prefers-reduced-motion: reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div class="box">
  <div class="bar"><i></i></div>
  <h1>お申し込みフォームへ<br>移動します。</h1>
  <p>自動で切り替わらない場合は、下のボタンからお進みください。</p>
  <a class="go" id="go" href="https://www.writeup.jp/contact/">フォームを開く</a>
  <a class="back" href="../">資料のご案内に戻る</a>
</div>
<script>
(function(){
  var FORM_URL = 'https://www.writeup.jp/contact/';   // ★遷移先はここ1か所
  var el = document.getElementById('go');
  if (el) el.href = FORM_URL;
  try { if (typeof fbq === 'function') fbq('track','Lead',{content_name:'jmatch_wp100'}); } catch(e){}
  try { if (typeof clarity === 'function') clarity('event','lead_wp100'); } catch(e){}
  setTimeout(function(){ location.replace(FORM_URL); }, 1600);
})();
</script>
</body>
</html>
