<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">誰でも、営業代行会社になれる。</title>
  <desc id="desc">人脈を紹介と継続収益に変えるAI営業代行会社スタートパック</desc>
  <rect width="1200" height="630" fill="#0b1812"/>
  <g stroke="#c8ff3d" stroke-width="3" stroke-dasharray="12 14" opacity=".55">
    <path d="M895 315 730 160M895 315 1050 145M895 315 735 470M895 315 1060 475"/>
  </g>
  <g fill="#0b1812" stroke-width="7"><circle cx="730" cy="160" r="42" stroke="#5aa7ff"/><circle cx="1050" cy="145" r="48" stroke="#5aa7ff"/><circle cx="735" cy="470" r="45" stroke="#ff765f"/><circle cx="1060" cy="475" r="54" stroke="#ff765f"/></g>
  <circle cx="895" cy="315" r="92" fill="#c8ff3d" stroke="#fffef8" stroke-width="7"/>
  <text x="895" y="305" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="900" fill="#0b1812">YOU</text>
  <text x="895" y="340" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#0b1812">SALES HUB</text>
  <text x="70" y="98" font-family="sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#c8ff3d">AI SALES AGENCY STARTER</text>
  <text x="70" y="210" font-family="sans-serif" font-size="78" font-weight="900" fill="#fffef8">誰でも、</text>
  <text x="70" y="307" font-family="sans-serif" font-size="90" font-weight="900" fill="#c8ff3d">営業代行会社</text>
  <text x="70" y="401" font-family="sans-serif" font-size="78" font-weight="900" fill="#fffef8">になれる。</text>
  <text x="70" y="505" font-family="sans-serif" font-size="25" font-weight="700" fill="#bdc9c1">出会いを記録し、相性を見つけ、紹介を生む。</text>
  <rect x="70" y="545" width="278" height="6" rx="3" fill="#ff765f"/><rect x="356" y="545" width="152" height="6" rx="3" fill="#5aa7ff"/>
