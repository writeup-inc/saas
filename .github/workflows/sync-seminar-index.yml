name: Sync seminar index

# seminar/ 配下にページを追加・削除したら、
# ルート index.html のヒーロー右側と seminar/index.html を自動で書き換えてコミットする。

on:
  push:
    branches: [main]
    paths:
      - "seminar/**"
      - "index.html"
      - "tools/build-seminar-index.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-seminar-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild seminar index
        run: node tools/build-seminar-index.mjs

      - name: Commit if the index changed
        run: |
          if git diff --quiet -- index.html seminar/index.html; then
            echo "セミナー一覧は最新です。コミットはありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html seminar/index.html
          git commit -m "セミナー一覧を自動同期" -m "Catalog-Update: no"
          git push
