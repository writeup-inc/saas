name: Check service index

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate root index
        run: node tools/check-index.mjs --history
