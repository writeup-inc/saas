name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated catalog is current
        run: node tools/sync-catalog.mjs --check

      - name: Validate service index
        run: node tools/check-index.mjs --history

      - name: Validate monitor index
        run: node tools/check-monitor.mjs

      - name: Validate partner briefing
        run: node tools/check-member.mjs

      - name: Guard critical typography
        run: node tools/check-critical-typography.mjs --self-test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: validate-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
